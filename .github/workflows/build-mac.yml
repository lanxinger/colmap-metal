name: COLMAP (Mac)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

jobs:
  format:
    name: Code format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check code format
        run: |
          python3 -m venv .ci-format
          .ci-format/bin/pip install ruff==0.17.3 clang-format==23.1.3
          PATH="$PWD/.ci-format/bin:$PATH" ./scripts/format/c++.sh --all
          PATH="$PWD/.ci-format/bin:$PATH" ./scripts/format/python.sh --all
          git diff --name-only
          git diff --exit-code || (echo "Code formatting failed" && exit 1)

  build:
    name: macos-15 arm64 Release
    needs: format
    runs-on: macos-15
    timeout-minutes: 60
    # Run every configuration on one host to reduce arm64 runner requests.

    env:
      COMPILER_CACHE_VERSION: 1
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      FETCHCONTENT_CACHE_VERSION: 2
      FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/build-mac/*/_deps
      GLOG_v: 2
      GLOG_logtostderr: 1

    steps:
      - uses: actions/checkout@v7

      - name: Restore compiler cache
        uses: actions/cache@v6
        id: cache-compiler
        with:
          key: v${{ env.COMPILER_CACHE_VERSION }}-macos-15-arm64-Release-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v${{ env.COMPILER_CACHE_VERSION }}-macos-15-arm64-Release
          path: ${{ env.COMPILER_CACHE_DIR }}

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        id: cache-fetchcontent
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-macos-15-arm64-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          restore-keys: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-macos-15-arm64-
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}

      - name: Setup Mac
        run: |
          brew install \
            cmake \
            ninja \
            boost \
            eigen \
            openimageio \
            metis \
            glog \
            googletest \
            ceres-solver \
            glew \
            sqlite3 \
            ccache \
            libomp
          brew link --force libomp

      - name: Build and test STD / MVS=OFF
        env:
          FETCHCONTENT_FULLY_DISCONNECTED: ${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
        run: bash scripts/ci-macos.sh STD OFF

      - name: Build and test BOOST / MVS=OFF
        env:
          FETCHCONTENT_FULLY_DISCONNECTED: ${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
        run: bash scripts/ci-macos.sh BOOST OFF

      - name: Build and test STD / MVS=ON
        env:
          FETCHCONTENT_FULLY_DISCONNECTED: ${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
        run: bash scripts/ci-macos.sh STD ON

      - name: Cleanup compiler cache
        run: |
          set -x
          ccache --show-stats --verbose
          ccache --evict-older-than 1d
          ccache --show-stats --verbose
