name: COLMAP (Mac)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

jobs:
  format:
    name: Code format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check code format
        run: |
          python3 -m venv .ci-format
          .ci-format/bin/pip install ruff==0.15.20 clang-format==22.1.5
          PATH="$PWD/.ci-format/bin:$PATH" ./scripts/format/c++.sh --all
          PATH="$PWD/.ci-format/bin:$PATH" ./scripts/format/python.sh --all
          git diff --name-only
          git diff --exit-code || (echo "Code formatting failed" && exit 1)

  build:
    name: macos-15 arm64 Release ${{ matrix.hash_backend }}
    needs: format
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hash_backend: [STD, BOOST]

    env:
      COMPILER_CACHE_VERSION: 1
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      FETCHCONTENT_CACHE_VERSION: 1
      FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/build/_deps
      GLOG_v: 2
      GLOG_logtostderr: 1

    steps:
      - uses: actions/checkout@v7

      - name: Restore compiler cache
        uses: actions/cache@v6
        id: cache-compiler
        with:
          key: v${{ env.COMPILER_CACHE_VERSION }}-macos-15-arm64-Release-${{ matrix.hash_backend }}-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: v${{ env.COMPILER_CACHE_VERSION }}-macos-15-arm64-Release
          path: ${{ env.COMPILER_CACHE_DIR }}

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        id: cache-fetchcontent
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-macos-15-arm64-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          restore-keys: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-macos-15-arm64-
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}

      - name: Setup Mac
        run: |
          brew install \
            cmake \
            ninja \
            boost \
            eigen \
            openimageio \
            metis \
            glog \
            googletest \
            ceres-solver \
            glew \
            sqlite3 \
            ccache \
            libomp
          brew link --force libomp

      - name: Configure and build
        run: |
          cmake --version
          mkdir -p build
          cd build
          # Exercise the default in the STD job and the explicit BOOST option.
          hash_backend="${{ matrix.hash_backend }}"
          if [ "$hash_backend" = STD ]; then
            hash_backend=""
          fi
          cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOLMAP_HASH_MAP_BACKEND="$hash_backend" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCCACHE_ENABLED=ON \
            -DCGAL_ENABLED=OFF \
            -DCUDA_ENABLED=OFF \
            -DDOWNLOAD_ENABLED=OFF \
            -DFETCH_ONNX=OFF \
            -DGUI_ENABLED=OFF \
            -DMETAL_ENABLED=ON \
            -DMVS_ENABLED=OFF \
            -DONNX_ENABLED=OFF \
            -DOPENGL_ENABLED=OFF \
            -DTESTS_ENABLED=ON \
            -DWERROR_ENABLED=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
          ninja

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error

      - name: Test installed hash backend
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/colmap-install"
          for requested in STD BOOST; do
            cmake -S cmake/tests/hash_map_backend -B "build-consumer-$requested" \
              -GNinja \
              -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/colmap-install" \
              -DCOLMAP_HASH_MAP_BACKEND="$requested" \
              -DEXPECTED_HASH_MAP_BACKEND=${{ matrix.hash_backend }}
            cmake --build "build-consumer-$requested"
            "build-consumer-$requested/hash_map_backend_test"
          done

      - name: Cleanup compiler cache
        run: |
          set -x
          ccache --show-stats --verbose
          ccache --evict-older-than 1d
          ccache --show-stats --verbose
